version: '3.8'

services:
  msr-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: msr-armbot:latest
    container_name: msr-armbot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - WEB_PORT=8080
      - CRON_SCHEDULE=30 1 * * *
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
    shm_size: '1gb'
    security_opt:
      - seccomp:unconfined
